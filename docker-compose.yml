services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/chunkvault
      "

  chunkvaultd:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command:
      - --repo=/data/repo
      - --addr=:8080
      - --s3-bucket=chunkvault
      - --s3-region=us-east-1
      - --s3-endpoint=http://minio:9000
    volumes:
      - vault-data:/data/repo

volumes:
  minio-data:
  vault-data:
