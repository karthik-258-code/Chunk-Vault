stages:
  - lint
  - test
  - build

include:
  # GitLab SAST (runs in the "test" stage).
  - template: Jobs/SAST.gitlab-ci.yml

default:
  image: golang:1.23

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -mod=readonly
  GOLANGCI_LINT_VERSION: v2.1.6
  GOCOVER_COBERTURA_VERSION: v1.2.0

.go-cache:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull-push

lint:
  stage: lint
  extends: .go-cache
  script:
    - test -x "$GOPATH/bin/golangci-lint" || GOFLAGS= go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
    - $GOPATH/bin/golangci-lint run ./...
    - test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }
    - go mod tidy -diff

test:
  stage: test
  extends: .go-cache
  script:
    - go test -race -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tee coverage.txt
    - test -x "$GOPATH/bin/gocover-cobertura" || GOFLAGS= go install github.com/boumenot/gocover-cobertura@${GOCOVER_COBERTURA_VERSION}
    - $GOPATH/bin/gocover-cobertura < coverage.out > coverage.xml
  coverage: '/total:\s+\(statements\)\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.out
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  extends: .go-cache
  parallel:
    matrix:
      - GOARCH: [amd64, arm64]
  variables:
    GOOS: linux
    CGO_ENABLED: "0"
  script:
    - mkdir -p dist
    - go build -trimpath -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o dist/chunkvault-${GOOS}-${GOARCH} ./cmd/chunkvault
    - ls -l dist
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
