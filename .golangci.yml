version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - unconvert
    - errorlint
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: var-naming
        - name: indent-error-flow
        - name: unreachable-code

  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
